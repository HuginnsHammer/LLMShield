services:
  llmshield:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLMSHIELD_AUDIT_DB: /data/audit.sqlite3
      LLMSHIELD_API_KEY: ${LLMSHIELD_API_KEY:?Set LLMSHIELD_API_KEY in your environment}
      LLMSHIELD_REQUIRE_API_KEY: "true"
      LLMSHIELD_ALLOW_REMOTE_PROVIDER: "false"
      LLMSHIELD_POLICY_FILE: /etc/llmshield/policy.yaml
    volumes:
      - llmshield-data:/data
      - ${LLMSHIELD_POLICY_HOST_PATH:-./policy.example.yaml}:/etc/llmshield/policy.yaml:ro
    restart: unless-stopped
  dashboard:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - llmshield
    restart: unless-stopped

volumes:
  llmshield-data:
