server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /health { proxy_pass http://llmshield:8000; }
  location /v1/ { proxy_pass http://llmshield:8000; }
  location /admin/ { proxy_pass http://llmshield:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
